[package]
name = "file_manager_tui"
version = "0.1.0"
edition = "2021"
description = "A terminal-based file manager TUI built with Rust and Ratatui"

[[bin]]
name = "fm"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
syntect = "5"
serde_json = "1"
fuzzy-matcher = "0.3"
notify = "7"
notify-debouncer-mini = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
portable-pty = "0.8"
vte = "0.13"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "NguyenSiTrung"
copyright = "MIT"
extended-description = "A fast, keyboard-driven terminal file manager built with Rust and Ratatui. Features dual-pane layout, Vim-style navigation, fuzzy finder, syntax highlighting preview, embedded terminal, inline editor, and S3 browse mode."
section = "utils"
priority = "optional"
assets = [
    ["target/release/fm", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/fm-tui/README.md", "644"],
    ["LICENSE", "usr/share/doc/fm-tui/LICENSE", "644"],
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
